
# ==========================================
# POD 1: API Gateway + Registration
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-core
  namespace: student-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-core
  template:
    metadata:
      labels:
        app: student-core
    spec:
      containers:

        # Container 1: API Gateway
        - name: api-gateway
          image: student-api-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: REGISTRATION_URL
              value: "http://localhost:3001"
            - name: LOGIN_URL
              value: "http://student-login-service:3002"

        # Container 2: Registration
        - name: registration
          image: student-registration:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: MONGO_URI

---

# ==========================================
# POD 2: Login Microservice
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-login
  namespace: student-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-login
  template:
    metadata:
      labels:
        app: student-login
    spec:
      containers:

        # Container 1: Login
        - name: login
          image: student-login:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: JWT_SECRET
